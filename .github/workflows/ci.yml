---
name: Ingress CI

on: [push]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest, "macos-latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - name: Install & Build
        run: |
          npm ci && npm run build
      - name: Test
        run: |
          npm test -- --test-reporter=node-test-github-reporter
